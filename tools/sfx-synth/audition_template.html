<title>효과음 후보 청취실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one column of event panels; each sound is a row whose waveform
     is the widest element, because the shape is what you compare by eye. */
  :root {
    --bg: #f4f6f6;
    --panel: #ffffff;
    --row: #fafbfb;
    --ink: #16211f;
    --ink-soft: #5c6b68;
    --ink-faint: #8c9a97;
    --line: #dde4e3;
    --accent: #0d7d75;
    --accent-soft: #d7efec;
    --wave: #0d7d75;
    --wave-idle: #b4c9c6;
    --hurt: #c05733;
    --hurt-soft: #f7e3da;
    --shadow: 0 1px 2px rgba(22, 33, 31, .06), 0 8px 24px -16px rgba(22, 33, 31, .3);
    --display: "Gothic A1", system-ui, sans-serif;
    --body: "IBM Plex Sans KR", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111918;
      --panel: #192322;
      --row: #1e2927;
      --ink: #e8efee;
      --ink-soft: #9fb0ad;
      --ink-faint: #71817e;
      --line: #2b3837;
      --accent: #4ed3c4;
      --accent-soft: #1d3936;
      --wave: #4ed3c4;
      --wave-idle: #3b4a48;
      --hurt: #e98a63;
      --hurt-soft: #3a2721;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111918;
    --panel: #192322;
    --row: #1e2927;
    --ink: #e8efee;
    --ink-soft: #9fb0ad;
    --ink-faint: #71817e;
    --line: #2b3837;
    --accent: #4ed3c4;
    --accent-soft: #1d3936;
    --wave: #4ed3c4;
    --wave-idle: #3b4a48;
    --hurt: #e98a63;
    --hurt-soft: #3a2721;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 64px;
  }

  header.top { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(26px, 5.2vw, 38px);
    line-height: 1.15;
    letter-spacing: -.02em;
    margin: 0;
    text-wrap: balance;
  }
  .lede { color: var(--ink-soft); max-width: 62ch; margin: 0; }

  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin: 22px 0 26px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .bar label { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); }
  .bar input[type="range"] { accent-color: var(--accent); width: 128px; }
  .vol { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); min-width: 4ch; }
  .stop {
    margin-left: auto;
    font: 500 13px var(--body);
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
  }
  .stop:hover { color: var(--ink); border-color: var(--ink-faint); }

  section.group { margin-bottom: 34px; }
  .ghead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 4px; }
  .ghead h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -.01em;
    margin: 0;
  }
  .chip {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 5px;
    padding: 2px 7px;
  }
  .gnote { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 12px; max-width: 64ch; }

  .rows {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .row {
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) 170px auto;
    align-items: center;
    gap: 14px;
    padding: 11px 14px;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row.playing { background: var(--row); }

  .play {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--panel);
    color: var(--accent);
    cursor: pointer;
    padding: 0;
    transition: background .12s, border-color .12s;
  }
  .play:hover { background: var(--accent-soft); border-color: var(--accent); }
  .play svg { width: 13px; height: 13px; fill: currentColor; display: block; }
  .row.playing .play { background: var(--accent); border-color: var(--accent); color: var(--panel); }

  .meta { min-width: 0; }
  .label { font-weight: 600; font-size: 14.5px; letter-spacing: -.005em; }
  .desc { color: var(--ink-soft); font-size: 13px; line-height: 1.45; }
  .file { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); word-break: break-all; }
  .parts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .part {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }

  canvas.wf { width: 100%; height: 36px; display: block; }
  .tail { display: flex; align-items: center; gap: 10px; justify-self: end; }
  .ms { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .rep {
    font: 500 12px var(--body);
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .rep:hover { color: var(--accent); border-color: var(--accent); }
  .rep[hidden] { display: none; }

  footer.note {
    margin-top: 40px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 12.5px;
  }
  footer.note code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 720px) {
    .row { grid-template-columns: 34px minmax(0, 1fr); grid-template-areas: "play meta" "wave wave" "tail tail"; }
    .play { grid-area: play; }
    .meta { grid-area: meta; }
    .wavecell { grid-area: wave; }
    .tail { grid-area: tail; justify-self: start; }
  }
</style>

<div class="wrap">
  <header class="top">
    <h1>효과음 후보 청취실</h1>
    <p class="lede">
      절차적으로 합성한 후보 음원이다. 전부 사인·삼각·사각·노이즈 레이어를 겹쳐 만들었고,
      파라미터는 <code>tools/sfx-synth</code>에 그대로 남아 있어 마음에 드는 쪽을 골라 수치만 다시 조절하면 된다.
      맨 아래 합성 장면이 실제 전투에서 들리는 모습에 가장 가깝다.
    </p>
  </header>

  <div class="bar">
    <label>
      음량
      <input id="vol" type="range" min="0" max="100" value="70">
      <span class="vol" id="volOut">70</span>
    </label>
    <label>
      <input id="loop" type="checkbox"> 반복 재생
    </label>
    <button class="stop" id="stopAll" type="button">정지</button>
  </div>

  <div id="groups"></div>

  <footer class="note">
    파일은 <code>output/sfx/&lt;묶음&gt;/</code>에 44.1kHz 16bit 모노 WAV로 들어 있다.
    다시 뽑으려면 <code>python render_sfx.py output/sfx --burst=5</code>.
  </footer>
</div>

<script id="sfx-data" type="application/json">/*__SFX_DATA__*/</script>
<script>
  const DATA = JSON.parse(document.getElementById('sfx-data').textContent);
  const PLAY_ICON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2 10 6l-7.5 4.8z"/></svg>';

  const volEl = document.getElementById('vol');
  const volOut = document.getElementById('volOut');
  const loopEl = document.getElementById('loop');
  let current = null;

  function stopCurrent() {
    if (!current) return;
    current.audio.pause();
    current.audio.currentTime = 0;
    current.row.classList.remove('playing');
    drawWave(current.canvas, current.env, -1);
    current = null;
  }

  function drawWave(canvas, env, progress) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 170;
    const h = canvas.clientHeight || 36;
    if (canvas.width !== Math.round(w * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const styles = getComputedStyle(document.documentElement);
    const played = styles.getPropertyValue('--wave').trim();
    const idle = styles.getPropertyValue('--wave-idle').trim();
    const mid = h / 2;
    const n = env.length;
    const bw = w / n;
    for (let i = 0; i < n; i++) {
      const frac = (i + 0.5) / n;
      const amp = Math.max(env[i] * (mid - 1), 0.6);
      ctx.fillStyle = progress >= 0 && frac <= progress ? played : idle;
      ctx.fillRect(i * bw, mid - amp, Math.max(bw - 0.7, 0.8), amp * 2);
    }
  }

  function tick() {
    if (current) {
      const a = current.audio;
      drawWave(current.canvas, current.env, a.duration ? a.currentTime / a.duration : 0);
    }
    requestAnimationFrame(tick);
  }

  function play(item, row, canvas, src) {
    const wasSame = current && current.row === row && current.src === src;
    stopCurrent();
    if (wasSame) return;
    const audio = new Audio(src);
    audio.volume = volEl.value / 100;
    audio.loop = loopEl.checked;
    audio.addEventListener('ended', () => { if (current && current.audio === audio) stopCurrent(); });
    current = { audio, row, canvas, env: item.env, src };
    row.classList.add('playing');
    audio.play().catch(() => stopCurrent());
  }

  function buildRow(item) {
    const row = document.createElement('div');
    row.className = 'row';

    const btn = document.createElement('button');
    btn.className = 'play';
    btn.type = 'button';
    btn.innerHTML = PLAY_ICON;
    btn.setAttribute('aria-label', item.label + ' 재생');
    row.appendChild(btn);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = item.label;
    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = item.desc;
    meta.append(label, desc);
    if (item.parts && item.parts.length) {
      const parts = document.createElement('div');
      parts.className = 'parts';
      for (const p of item.parts) {
        const chip = document.createElement('span');
        chip.className = 'part';
        chip.textContent = p;
        parts.appendChild(chip);
      }
      meta.appendChild(parts);
    } else {
      const file = document.createElement('div');
      file.className = 'file';
      file.textContent = item.name + '.wav';
      meta.appendChild(file);
    }
    row.appendChild(meta);

    const wavecell = document.createElement('div');
    wavecell.className = 'wavecell';
    const canvas = document.createElement('canvas');
    canvas.className = 'wf';
    wavecell.appendChild(canvas);
    row.appendChild(wavecell);

    const tail = document.createElement('div');
    tail.className = 'tail';
    const ms = document.createElement('span');
    ms.className = 'ms';
    ms.textContent = item.ms + ' ms';
    tail.appendChild(ms);
    if (item.burst) {
      const rep = document.createElement('button');
      rep.className = 'rep';
      rep.type = 'button';
      rep.textContent = item.burst.count + '연타';
      rep.title = item.burst.gap + '초 간격으로 ' + item.burst.count + '번';
      rep.addEventListener('click', () => play(item, row, canvas, item.burst.audio));
      tail.appendChild(rep);
    }
    row.appendChild(tail);

    btn.addEventListener('click', () => play(item, row, canvas, item.audio));
    requestAnimationFrame(() => drawWave(canvas, item.env, -1));
    new ResizeObserver(() => {
      if (!current || current.canvas !== canvas) drawWave(canvas, item.env, -1);
    }).observe(canvas);
    return row;
  }

  const host = document.getElementById('groups');
  for (const group of DATA.groups) {
    const section = document.createElement('section');
    section.className = 'group';

    const head = document.createElement('div');
    head.className = 'ghead';
    const h2 = document.createElement('h2');
    h2.textContent = group.title;
    head.appendChild(h2);
    if (group.key) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = group.key;
      head.appendChild(chip);
    }
    section.appendChild(head);

    const note = document.createElement('p');
    note.className = 'gnote';
    note.textContent = group.note;
    section.appendChild(note);

    const rows = document.createElement('div');
    rows.className = 'rows';
    for (const item of group.items) rows.appendChild(buildRow(item));
    section.appendChild(rows);
    host.appendChild(section);
  }

  volEl.addEventListener('input', () => {
    volOut.textContent = volEl.value;
    if (current) current.audio.volume = volEl.value / 100;
  });
  loopEl.addEventListener('change', () => {
    if (current) current.audio.loop = loopEl.checked;
  });
  document.getElementById('stopAll').addEventListener('click', stopCurrent);
  // The waveform colours come from the theme tokens, so redraw on a theme flip.
  const allItems = DATA.groups.flatMap(g => g.items);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    const canvases = host.querySelectorAll('canvas.wf');
    allItems.forEach((item, i) => {
      if (canvases[i] && (!current || current.canvas !== canvases[i])) drawWave(canvases[i], item.env, -1);
    });
  });
  requestAnimationFrame(tick);
</script>
