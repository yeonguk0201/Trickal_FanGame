<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>용사용 한손 공격 · 적용 전 검수</title>
<style>*{box-sizing:border-box}body{margin:0;background:#172126;color:#edf3ed;font:16px system-ui}main{max-width:1080px;margin:auto;padding:28px}h1{font-size:27px;margin:0 0 10px}p{color:#b9c8c6;line-height:1.6}button,select{font:inherit;background:#314348;color:#fff;border:1px solid #627776;border-radius:7px;padding:9px 14px;margin:4px}button.active{background:#786139}canvas{width:100%;background:radial-gradient(ellipse at bottom,#57634b,#283932);border:1px solid #627369;border-radius:12px}label{margin:10px;display:inline-block}input{vertical-align:middle}.tag{color:#f1ce82}img{max-width:100%;background:#34463f}small{color:#b9c8c6}a{color:#f1ce82}</style>
<main><span class="tag">미술 검수용 v1 · 게임 미적용</span><h1>용사용 · 한 손 검 / 반대 손 방패</h1><p>왼쪽은 기존 대기 원본, 오른쪽은 대기 → 새 동작 → 대기 연결입니다. 머리·몸통 비율과 발 위치, 검을 잡는 손을 비교하세요.</p>
<nav id="motions"></nav><canvas id="stage" width="1000" height="440"></canvas>
<div><button id="play">일시정지</button><button id="next">다음 자세</button><button id="restart">처음부터</button><label>속도 <select id="speed"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select></label><label><input type="checkbox" id="flip">좌우 반전</label><label><input type="checkbox" id="ghost">대기 원본 겹치기</label></div>
<p id="state">이미지 불러오는 중…</p><small>표시 배율과 발 기준점은 이 미리보기에서 맞춘 임시 값입니다. 동작 타이밍은 검수용이며 Unity 이벤트·이펙트 연결을 재현한 화면은 아닙니다. 원본 비율을 유지하며 확대·축소합니다.</small>
<details><summary>생성 원본 시트 보기</summary><img id="sheet" alt="선택한 동작의 4프레임 시트"></details></main>
<script>
const configs=[{name:'기본 · 일반 공격',src:'swing.png',body:.38,feet:[[.30,.474],[.79,.474],[.30,.946],[.80,.946]],split:[.472,.535]}, {name:'기본 · 대쉬',src:'dash.png',body:.40,feet:[[.31,.454],[.80,.465],[.31,.947],[.80,.94]],split:[.50,.515]}, {name:'기본 · 내려찍기',src:'slam.png',body:.35,feet:[[.32,.496],[.79,.496],[.33,.945],[.80,.951]],split:[.50,.54]}, {name:'황금 · 내려찍기',src:'golden-slam.png',body:.31,golden:true,feet:[[.30,.50],[.79,.50],[.32,.928],[.78,.93]],split:[.52,.535]}];
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');let selected=0,frame=0,playing=true,elapsed=0,previous=0,ready=false;
const names=['대기 원본','준비','발동 준비 / 전진','타격 / 진행','회수','대기 원본'],durations=[850,240,220,180,300,650];
const images={};async function init(){for(const src of ['idle.png','golden-idle.png',...configs.map(c=>c.src)]){let im=new Image();im.src=src;await im.decode();images[src]=im;}ready=true;draw();requestAnimationFrame(tick);}init().catch(e=>document.getElementById('state').textContent='이미지 로드 실패: '+e.message);
configs.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.name;b.onclick=()=>{selected=i;frame=0;elapsed=0;update();draw()};document.getElementById('motions').appendChild(b)});
function update(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===selected));document.getElementById('sheet').src=configs[selected].src;}update();
function idle(x,alpha=1){const golden=configs[selected].golden,im=images[golden?'golden-idle.png':'idle.png'];const scale=210/(im.height*(golden?.425:.85));ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,365);if(document.getElementById('flip').checked)ctx.scale(-1,1);ctx.drawImage(im,-im.width*(golden?.50:.55)*scale,-im.height*(golden?.731:.937)*scale,im.width*scale,im.height*scale);ctx.restore();}
function pose(x,index){const c=configs[selected],im=images[c.src],s=210/(im.height*c.body),f=c.feet[index];ctx.save();ctx.translate(x,365);if(document.getElementById('flip').checked)ctx.scale(-1,1);ctx.scale(s,s);ctx.translate(-f[0]*im.width,-f[1]*im.height);
// Slightly staggered partitions preserve swords and capes crossing the nominal cell gutter.
let top=index<2,left=index%2===0,split=c.split[top?0:1],y0=top?0:.52,y1=top?.52:1;
ctx.beginPath();if(c.src==='swing.png'&&top){const pts=left?[[0,0],[.472,0],[.472,.36],[.51,.36],[.51,.52],[0,.52]]:[[.472,0],[1,0],[1,.52],[.51,.52],[.51,.36],[.472,.36]];pts.forEach((p,i)=>i?ctx.lineTo(p[0]*im.width,p[1]*im.height):ctx.moveTo(p[0]*im.width,p[1]*im.height));}else{ctx.rect((left?0:split)*im.width,y0*im.height,(left?split:1-split)*im.width,(y1-y0)*im.height);}ctx.clip();ctx.drawImage(im,0,0);ctx.restore();}
function draw(){if(!ready)return;ctx.clearRect(0,0,1000,440);ctx.strokeStyle='#82917b';ctx.beginPath();ctx.moveTo(35,366);ctx.lineTo(965,366);ctx.stroke();ctx.fillStyle='#e8efdf';ctx.font='18px system-ui';ctx.fillText('기준 · 기존 대기',150,36);ctx.fillText('새 동작 연결 · '+names[frame],610,36);idle(260);if(document.getElementById('ghost').checked)idle(750,.23);if(frame===0||frame===5)idle(750);else pose(750,frame-1);document.getElementById('state').textContent=configs[selected].name+' · '+names[frame]+' ('+(frame+1)+'/6)';}
function tick(now){if(previous&&playing){elapsed+=(now-previous)*Number(document.getElementById('speed').value);if(elapsed>=durations[frame]){elapsed=0;frame=(frame+1)%6;draw()}}previous=now;requestAnimationFrame(tick)}
function sync(){document.getElementById('play').textContent=playing?'일시정지':'재생';draw()}document.getElementById('play').onclick=()=>{playing=!playing;sync()};document.getElementById('next').onclick=()=>{playing=false;frame=(frame+1)%6;elapsed=0;sync()};document.getElementById('restart').onclick=()=>{frame=0;elapsed=0;sync()};document.getElementById('flip').onchange=draw;document.getElementById('ghost').onchange=draw;
</script></html>
