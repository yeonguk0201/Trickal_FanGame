<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로딩 화면 · 연두빛 캐릭터 카드 시안</title>
<style>
@font-face{font-family:One;src:url('__FONT__')}*{box-sizing:border-box}body{margin:0;background:#eff3ec;color:#293a29;font:14px system-ui,sans-serif}button,input,textarea,select{font:inherit}button,select{cursor:pointer}button{border:1px solid #c8d3c4;border-radius:7px;padding:9px 12px;background:white;color:#2b4329}button:hover{background:#edf5e5}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #80b54a;outline-offset:2px}header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;border-bottom:1px solid #d6dfd0}header strong{font-size:17px}header span{color:#75806e;font-size:12px}header .actions{display:flex;gap:8px;margin-left:auto;align-items:center}select{padding:8px;border:1px solid #c8d3c4;border-radius:6px;background:#fff}main{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:calc(100vh - 68px)}.workspace{padding:30px 24px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:15px}.stage-box{position:relative;overflow:hidden;box-shadow:0 12px 44px #3d562424;border-radius:3px;flex-shrink:0}#stage{position:relative;transform-origin:top left;overflow:hidden;isolation:isolate;background-color:#a9db96;background-image:radial-gradient(ellipse at 50% 40%,#e1f1b33d,transparent 65%);font-family:One,sans-serif;color:#343735}.pattern{position:absolute;inset:0;pointer-events:none}
.pattern{
  background-image:var(--motifs),conic-gradient(#ffffff09 25%,#689b4310 0 50%,#ffffff09 0 75%,#689b4310 0);
  background-size:300px 300px;
  animation:scroll-diagonal 8s linear infinite;
}
@keyframes scroll-diagonal{to{background-position:-300px -300px}}
.layer{position:absolute;display:flex;align-items:center;justify-content:center;transform-origin:center;white-space:pre-line;text-align:center;user-select:none;touch-action:none;cursor:move}.layer.selected{outline:2px dashed #315923;outline-offset:5px}.layer .content{width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}.handle{position:absolute;width:18px;height:18px;background:#fff;border:3px solid #315923;z-index:999}.handle[data-corner=nw]{left:-12px;top:-12px;cursor:nwse-resize}.handle[data-corner=ne]{right:-12px;top:-12px;cursor:nesw-resize}.handle[data-corner=sw]{left:-12px;bottom:-12px;cursor:nesw-resize}.handle[data-corner=se]{right:-12px;bottom:-12px;cursor:nwse-resize}.portrait{border:11px solid #f1ffba;border-radius:50%;background:#e3efb0;overflow:hidden}.portrait img{height:116%;width:116%;object-fit:contain;max-width:none;transform:translate(var(--portrait-x,0px),calc(6% + var(--portrait-y,0px))) scale(var(--portrait-zoom,1));transform-origin:center}.bubble{border-radius:60px;background:#fff;filter:drop-shadow(0 8px 0 #516c4345);line-height:1.45}.bubble:after{content:'';position:absolute;right:65px;bottom:-16px;width:45px;height:50px;background:#fff;border-radius:0 0 9px 40px;transform:rotate(-20deg);z-index:-1}.strap{background:#7ab439;border-radius:15px}.outlined{-webkit-text-stroke:6px #fff;paint-order:stroke fill}.nameplate{border:16px solid #589d36;background:#fff;border-radius:32px}.nameplate:before{content:'';position:absolute;inset:7px;border:2px dashed #d7eea4;border-radius:16px}.nameplate .content{position:relative}.track{border:4px solid #42593c;background:#e0ecc4;border-radius:30px;overflow:hidden}.track .fill{position:absolute;left:0;top:0;bottom:0;background:#bada52;border-radius:30px}.caption{font-size:12px;color:#77836f;display:flex;justify-content:space-between;gap:16px}aside{background:#fafcf8;border-left:1px solid #d6dfd0;padding:20px 16px;overflow:auto}h2{margin:0 0 12px;font-size:14px}h3{font-size:13px;margin:20px 0 10px}#layers{display:grid;gap:5px}#layers button{display:flex;justify-content:space-between;text-align:left;font-size:13px;padding:9px 10px}#layers button.active{background:#e2edda;border-color:#8fab7b}label{display:block;color:#63725d;font-size:12px;margin-bottom:8px}input,textarea{width:100%;border:1px solid #cad5c2;background:#fff;border-radius:5px;padding:7px;color:#283f25}label input,label textarea{margin-top:5px}input[type=checkbox]{width:auto}input[type=range]{padding:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}textarea{resize:vertical;min-height:70px}.row{display:flex;gap:6px;flex-wrap:wrap}small{display:block;color:#798571;font-size:11px;line-height:1.6;margin-top:9px}#status{min-height:20px;font-size:12px;color:#547640}body.preview header,body.preview aside,body.preview .caption{display:none}body.preview main{display:block;min-height:100vh}body.preview .workspace{padding:0;min-height:100vh;align-items:center;background:#23301f}body.preview .stage-box{border-radius:0;box-shadow:none}#exit{display:none;position:fixed;right:15px;top:15px;z-index:9999;opacity:.35}#exit:hover{opacity:1}body.preview #exit{display:block}body.preview .layer{cursor:default}@media(max-width:850px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #d6dfd0}header{flex-wrap:wrap}header .actions{margin-left:0}.workspace{padding:14px}#layers{grid-template-columns:repeat(2,1fr)}}
</style>
<header><strong>로딩 화면 시안</strong><span>연두빛 체크 · 캐릭터 소개</span><div class="actions"><select id="ratio" aria-label="화면 비율"><option value="1080">16:9 · 1920 × 1080</option><option value="884">참고 비율 · 1920 × 884</option></select><button id="preview">미리보기</button><button id="reset-all">전체 초기화</button></div></header>
<main><section class="workspace"><div class="stage-box" id="box"><div id="stage"><div class="pattern" id="pattern"></div></div></div><div class="caption"><span>선택 후 드래그로 이동 · 모서리로 크기 조절 · Shift로 비율 유지</span><span>방향키 1px / Shift 10px</span></div></section><aside><h2>레이어</h2><div id="layers"></div><h3 id="selected-title">레이어를 선택하세요</h3><div id="properties" hidden><div class="fields" id="fields"></div><label id="portrait-zoom-field" hidden>원 안 캐릭터 크기 <output id="portrait-zoom-label">100%</output><input id="portrait-zoom" aria-label="원 안 캐릭터 크기 슬라이더" type="range" min="25" max="400" step="1" value="100"></label><label id="portrait-pan-field" hidden><input id="portrait-pan-mode" type="checkbox"> 드래그로 원 안 캐릭터만 이동<small>Alt+드래그로도 이동할 수 있습니다.<br>캐릭터 X/Y는 원 안에서의 이동량(px)입니다.</small></label><label id="text-field">문구<textarea id="text"></textarea></label><label id="color-field">글자색<input id="color" type="color"></label><label><input id="visible" type="checkbox"> 표시</label><button id="reset-one">선택 초기화</button></div><h3>로딩 상태</h3><label>진행률 <output id="percent-label">72%</output><input id="progress" aria-label="로딩 진행률" type="range" min="0" max="100" value="72"></label><div class="row"><button id="play">로딩 재생</button><button id="swap">다른 초상 넣기</button></div><input hidden id="art-file" type="file" accept="image/*"><small>초상: 기존 에르핀 원화 임시 사용<br>글꼴: ONE Mobile POP · 오프라인 사용 가능<br>배치값은 이 브라우저에 자동 저장됩니다.</small><h3>배치값 공유</h3><div class="row"><button id="export">JSON 내보내기</button><button id="import">JSON 적용</button><button id="request">수정 요청문</button></div><label style="margin-top:10px">복사 / 붙여넣기<textarea id="share" aria-label="공유할 배치값" placeholder="JSON 또는 수정 요청문이 여기에 표시됩니다."></textarea></label><div id="status" role="status"></div></aside></main><button id="exit">편집으로 돌아가기 · Esc</button>
<script>
'use strict';
const ART='__ART__', $=id=>document.getElementById(id), KEY='trickal.loading-concept.v1';
const clone=v=>JSON.parse(JSON.stringify(v));
function defaults(h=1080){const wide=h===884;return {version:1,canvas:{width:1920,height:h,origin:'top-left',anchor:'top-left',rotation:'clockwise-degrees'},progress:72,art:ART,layers:[
{id:'portrait',name:'원형 캐릭터 초상',kind:'portrait',portraitZoom:100,portraitX:0,portraitY:0,x:wide?665:630,y:wide?60:65,w:wide?590:660,h:wide?590:660,z:1,rotation:0,visible:true},
{id:'bubble',name:'말풍선',kind:'bubble',x:wide?470:415,y:wide?78:102,w:wide?320:355,h:wide?190:210,z:4,rotation:0,visible:true,text:'히힛! 온 세상이\n알록달록해!',font:wide?27:30,color:'#555751'},
{id:'strap',name:'수식어 띠',kind:'strap',x:750,y:wide?646:740,w:420,h:32,z:2,rotation:0,visible:true},
{id:'epithet',name:'수식어',kind:'outlined',x:715,y:wide?632:725,w:490,h:53,z:3,rotation:0,visible:true,text:'그림일기의 거장',font:35,color:'#343735'},
{id:'name',name:'캐릭터 이름표',kind:'nameplate',x:585,y:wide?691:799,w:750,h:118,z:2,rotation:0,visible:true,text:'에르핀(크레파스)',font:48,color:'#30332e'},
{id:'bar',name:'로딩 바',kind:'track',x:100,y:h-39,w:1720,h:18,z:2,rotation:0,visible:true},
{id:'percent',name:'로딩 퍼센트',kind:'outlined',x:835,y:h-81,w:250,h:55,z:3,rotation:0,visible:true,text:'72%',font:35,color:'#343735'}]};}
function validate(v){if(!v||v.version!==1||!v.canvas||v.canvas.width!==1920||![884,1080].includes(v.canvas.height)||!Array.isArray(v.layers)||v.layers.length!==7)throw Error('이 시안의 버전 1 JSON을 사용하세요.');const base=defaults(v.canvas.height);if(!Number.isFinite(v.progress)||v.progress<0||v.progress>100)throw Error('진행률은 0~100입니다.');const ids=new Set();for(const l of v.layers){const b=base.layers.find(x=>x.id===l.id);if(!b||ids.has(l.id)||b.kind!==l.kind)throw Error('레이어 ID 또는 종류를 확인하세요.');ids.add(l.id);if(l.kind==='portrait'){for(const k of ['portraitX','portraitY']){if(l[k]===undefined)l[k]=0;if(!Number.isFinite(l[k])||Math.abs(l[k])>20000)throw Error('캐릭터 위치를 확인하세요.');}if(l.portraitZoom===undefined)l.portraitZoom=100;if(!Number.isFinite(l.portraitZoom)||l.portraitZoom<25||l.portraitZoom>400)throw Error('캐릭터 크기는 25~400%입니다.');}for(const k of ['x','y','w','h','z','rotation'])if(!Number.isFinite(l[k])||Math.abs(l[k])>20000)throw Error('배치 수치를 확인하세요.');if(l.w<20||l.h<10||typeof l.visible!=='boolean')throw Error('레이어 크기와 표시값을 확인하세요.');if(b.text!==undefined&&(typeof l.text!=='string'||!Number.isFinite(l.font)||l.font<8||l.font>500||!/^#[0-9a-f]{6}$/i.test(l.color)))throw Error('문구와 글꼴 속성을 확인하세요.');}if(typeof v.art!=='string'||!/^data:image\/(png|jpeg|webp|gif);base64,/.test(v.art))throw Error('초상은 포함된 이미지 데이터여야 합니다.');return v;}
let model=defaults(), selected=null, scale=1, timer=null;
try{const saved=localStorage.getItem(KEY);if(saved)model=validate(JSON.parse(saved));}catch(e){$('status').textContent='기본 시안으로 열었습니다. 저장값을 읽을 수 없습니다.';}
const tree='<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><g opacity=".23"><g fill="none" stroke="#e9ffd5" stroke-width="5" stroke-linejoin="round"><path d="M74 100v-23c-16 6-31-2-26-14-16 0-21-18-9-25-4-16 14-23 24-18 5-15 23-15 30-4 16-7 29 5 26 18 17 3 19 22 7 30 6 14-11 25-28 17v19z"/><path d="M74 83V49m0 17L60 55m14 9 16-15"/></g><path d="m229 62 5 12 13 1-10 9 3 13-11-7-12 7 3-13-10-9 14-1z" fill="#82bd65"/><g transform="translate(150 150)"><g fill="none" stroke="#e9ffd5" stroke-width="5" stroke-linejoin="round"><path d="M74 100v-23c-16 6-31-2-26-14-16 0-21-18-9-25-4-16 14-23 24-18 5-15 23-15 30-4 16-7 29 5 26 18 17 3 19 22 7 30 6 14-11 25-28 17v19z"/><path d="M74 83V49m0 17L60 55m14 9 16-15"/></g></g><path d="m79 212 5 12 13 1-10 9 3 13-11-7-12 7 3-13-10-9 14-1z" fill="#82bd65"/></g></svg>';
$('pattern').style.setProperty('--motifs',`url("data:image/svg+xml,${encodeURIComponent(tree)}")`);
function status(s){$('status').textContent=s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(model));}catch(e){status('자동 저장을 사용할 수 없습니다. JSON을 복사해 보관하세요.');}}
function fit(){const wrap=$('box'),space=wrap.parentElement;const width=space.clientWidth-(document.body.classList.contains('preview')?0:parseFloat(getComputedStyle(space).paddingLeft)*2);scale=Math.min(width/1920,(document.body.classList.contains('preview')?innerHeight:innerHeight-155)/model.canvas.height);scale=Math.max(.12,scale);wrap.style.width=1920*scale+'px';wrap.style.height=model.canvas.height*scale+'px';$('stage').style.width='1920px';$('stage').style.height=model.canvas.height+'px';$('stage').style.transform=`scale(${scale})`;}
function updateProgress(){const p=Math.round(model.progress);$('progress').value=p;$('percent-label').textContent=p+'%';const bar=document.querySelector('#layer-bar .fill');if(bar)bar.style.width=p+'%';const txt=document.querySelector('#layer-percent .content');if(txt)txt.textContent=p+'%';}
function paint(){for(const old of $('stage').querySelectorAll('.layer'))old.remove();for(const l of model.layers){const el=document.createElement('div');el.id='layer-'+l.id;el.className='layer '+l.kind+(selected===l.id&&!document.body.classList.contains('preview')?' selected':'');Object.assign(el.style,{left:l.x+'px',top:l.y+'px',width:l.w+'px',height:l.h+'px',zIndex:l.z,transform:`rotate(${l.rotation}deg)`,display:l.visible?'flex':'none',fontSize:(l.font||30)+'px',color:l.color||''});const content=document.createElement('div');content.className='content';if(l.kind==='portrait'){const img=document.createElement('img');img.src=model.art;img.alt='에르핀 초상';img.style.setProperty('--portrait-zoom',l.portraitZoom/100);img.style.setProperty('--portrait-x',l.portraitX+'px');img.style.setProperty('--portrait-y',l.portraitY+'px');content.append(img);}else if(l.kind==='track'){const fill=document.createElement('div');fill.className='fill';content.append(fill);}else content.textContent=l.text||'';el.append(content);if(selected===l.id&&!document.body.classList.contains('preview'))for(const c of ['nw','ne','sw','se']){const handle=document.createElement('span');handle.className='handle';handle.dataset.corner=c;el.append(handle);}el.onpointerdown=e=>startDrag(e,l);$('stage').append(el);}updateProgress();$('ratio').value=model.canvas.height;renderList();fit();}
function renderList(){$('layers').replaceChildren();for(const l of [...model.layers].sort((a,b)=>b.z-a.z)){const b=document.createElement('button');b.textContent=l.name+(l.visible?'':' (숨김)');b.className=selected===l.id?'active':'';b.onclick=()=>select(l.id);$('layers').append(b);}}
function select(id){selected=id;paint();inspector();}
const numeric=[['x','X'],['y','Y'],['w','너비'],['h','높이'],['z','겹침 순서'],['rotation','회전 °'],['font','글자 크기'],['portraitZoom','캐릭터 크기 (%)'],['portraitX','캐릭터 X (px)'],['portraitY','캐릭터 Y (px)']];
function inspector(){const l=model.layers.find(x=>x.id===selected);$('properties').hidden=!l;$('selected-title').textContent=l?l.name:'레이어를 선택하세요';if(!l)return;$('fields').replaceChildren();for(const [key,label] of numeric){if((key==='font'&&l.font===undefined)||(key.startsWith('portrait')&&l.kind!=='portrait'))continue;const wrapper=document.createElement('label');wrapper.textContent=label;const input=document.createElement('input');input.type='number';input.value=Math.round(l[key]*100)/100;input.setAttribute('aria-label',label);input.onchange=()=>{const n=Number(input.value);if(!Number.isFinite(n))return;const min=key==='w'?20:key==='h'?10:key==='font'?8:key==='portraitZoom'?25:-20000;l[key]=Math.min(key==='font'?500:key==='portraitZoom'?400:20000,Math.max(min,n));paint();if(key==='portraitZoom')inspector();save();};wrapper.append(input);$('fields').append(wrapper);}$('portrait-zoom-field').hidden=l.kind!=='portrait';$('portrait-pan-field').hidden=l.kind!=='portrait';if(l.kind==='portrait'){$('portrait-zoom').value=l.portraitZoom;$('portrait-zoom-label').textContent=Math.round(l.portraitZoom)+'%';}$('text-field').hidden=l.text===undefined||l.id==='percent';$('color-field').hidden=l.color===undefined;$('text').value=l.text||'';$('color').value=l.color||'#343735';$('visible').checked=l.visible;}
function startDrag(e,l){if(document.body.classList.contains('preview')||e.button!==0)return;e.preventDefault();selected=l.id;const original=clone(l),corner=e.target.dataset.corner,pan=l.kind==='portrait'&&!corner&&(e.altKey||$('portrait-pan-mode').checked),start=[e.clientX,e.clientY],r=l.rotation*Math.PI/180,c=Math.cos(r),s=Math.sin(r),sx=corner?.includes('e')?1:-1,sy=corner?.includes('s')?1:-1;select(l.id);const target=$('layer-'+l.id);target.setPointerCapture(e.pointerId);function move(ev){const dx=(ev.clientX-start[0])/scale,dy=(ev.clientY-start[1])/scale;if(pan){l.portraitX=original.portraitX+c*dx+s*dy;l.portraitY=original.portraitY-s*dx+c*dy;const img=target.querySelector('img');img.style.setProperty('--portrait-x',l.portraitX+'px');img.style.setProperty('--portrait-y',l.portraitY+'px');}else if(!corner){l.x=original.x+dx;l.y=original.y+dy;}else{const lx=c*dx+s*dy,ly=-s*dx+c*dy;let w=Math.max(20,original.w+sx*lx),h=Math.max(10,original.h+sy*ly);if(ev.shiftKey){const factor=Math.max(w/original.w,h/original.h);w=original.w*factor;h=original.h*factor;}const ax=sx*(w-original.w)/2,ay=sy*(h-original.h)/2;l.x=original.x+original.w/2+c*ax-s*ay-w/2;l.y=original.y+original.h/2+s*ax+c*ay-h/2;l.w=w;l.h=h;if(original.font)l.font=Math.max(8,Math.min(500,original.font*Math.min(w/original.w,h/original.h)));}Object.assign(target.style,{left:l.x+'px',top:l.y+'px',width:l.w+'px',height:l.h+'px',fontSize:(l.font||30)+'px'});inspector();}function up(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);save();}window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);}
$('portrait-zoom').oninput=()=>{const l=model.layers.find(x=>x.id===selected);if(l?.kind==='portrait'){l.portraitZoom=Number($('portrait-zoom').value);paint();inspector();save();}};
$('text').oninput=()=>{const l=model.layers.find(x=>x.id===selected);if(l&&l.id!=='percent'){l.text=$('text').value;paint();save();}};
$('color').oninput=()=>{const l=model.layers.find(x=>x.id===selected);if(l){l.color=$('color').value;paint();save();}};
$('visible').onchange=()=>{const l=model.layers.find(x=>x.id===selected);if(l){l.visible=$('visible').checked;paint();save();}};
function stop(){clearInterval(timer);timer=null;$('play').textContent='로딩 재생';}
$('progress').oninput=()=>{stop();model.progress=Number($('progress').value);updateProgress();save();};
$('play').onclick=()=>{if(timer){stop();return;}model.progress=0;$('play').textContent='재생 정지';updateProgress();timer=setInterval(()=>{model.progress=Math.min(100,model.progress+1);updateProgress();if(model.progress===100){stop();save();}},70);};
$('ratio').onchange=()=>{stop();model=defaults(Number($('ratio').value));selected=null;paint();inspector();save();status('선택한 화면 비율의 기본 배치를 적용했습니다.');};
$('reset-all').onclick=()=>{stop();model=defaults(model.canvas.height);selected=null;paint();inspector();save();status('전체 배치를 초기화했습니다.');};
$('reset-one').onclick=()=>{const i=model.layers.findIndex(l=>l.id===selected);if(i>=0){model.layers[i]=defaults(model.canvas.height).layers.find(l=>l.id===selected);paint();inspector();save();}};
function preview(on){document.body.classList.toggle('preview',on);paint();}
$('preview').onclick=()=>preview(true);$('exit').onclick=()=>preview(false);
$('export').onclick=()=>{$('share').value=JSON.stringify(model,null,2);$('share').select();status('JSON을 선택했습니다. Ctrl+C로 복사하세요.');};
$('import').onclick=()=>{try{const incoming=validate(JSON.parse($('share').value));stop();model=incoming;selected=null;paint();inspector();save();status('JSON 배치를 적용했습니다.');}catch(e){status('적용하지 못했습니다: '+e.message);}};
$('request').onclick=()=>{const changed=model.layers.map(l=>`${l.name}: X ${Math.round(l.x)}, Y ${Math.round(l.y)}, 크기 ${Math.round(l.w)}×${Math.round(l.h)}, 회전 ${Math.round(l.rotation)}°, 순서 ${l.z}, ${l.visible?'표시':'숨김'}${l.kind==='portrait'?`, 원 안 캐릭터 크기 ${l.portraitZoom}%, 캐릭터 이동 X ${Math.round(l.portraitX)}px / Y ${Math.round(l.portraitY)}px`:''}${l.text!==undefined&&l.id!=='percent'?`, 문구 “${l.text.replaceAll('\n',' / ')}”, 글자 ${Math.round(l.font)}px, 색 ${l.color}`:''}`).join('\n');$('share').value=`로딩 화면 시안을 아래 배치로 수정해줘.\n기준 ${model.canvas.width}×${model.canvas.height}, 좌상단 원점·레이어 좌상단 기준, 시계 방향 회전.\n${changed}\n로딩 진행률 ${Math.round(model.progress)}%.`;$('share').select();status('수정 요청문을 복사해 채팅에 붙여넣으세요.');};
$('swap').onclick=()=>$('art-file').click();$('art-file').onchange=async()=>{const f=$('art-file').files[0];if(!f)return;if(!/^image\/(png|jpeg|webp|gif)$/.test(f.type)||f.size>8*1024*1024){status('8MB 이하 PNG/JPG/WebP/GIF를 선택하세요.');return;}const reader=new FileReader();reader.onload=()=>{model.art=reader.result;paint();save();status('초상을 교체했습니다.');};reader.readAsDataURL(f);};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){preview(false);return;}if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)||document.body.classList.contains('preview'))return;const l=model.layers.find(x=>x.id===selected);if(!l||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const n=e.shiftKey?10:1,dx=e.key==='ArrowLeft'?-n:e.key==='ArrowRight'?n:0,dy=e.key==='ArrowUp'?-n:e.key==='ArrowDown'?n:0;if(l.kind==='portrait'&&(e.altKey||$('portrait-pan-mode').checked)){const r=l.rotation*Math.PI/180;l.portraitX+=Math.cos(r)*dx+Math.sin(r)*dy;l.portraitY+=-Math.sin(r)*dx+Math.cos(r)*dy;}else{l.x+=dx;l.y+=dy;}paint();inspector();save();});
window.addEventListener('resize',fit);if(new URLSearchParams(location.search).has('preview'))document.body.classList.add('preview');paint();
</script>
</html>
